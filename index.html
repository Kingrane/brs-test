<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Полнофункциональный клиент Сервиса БРС SFEDU">
    <meta name="theme-color" content="#f4f4f5">
    <meta name="color-scheme" content="light">
    <title>SUPER БРС</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="SuperBRS">
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Critical: painted before any bundle arrives, so the first frame is branded. */
        :root {
            color-scheme: light;
        }

        html,
        body {
            margin: 0;
            background: #f4f4f5;
        }

        .boot {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: #f4f4f5;
            text-align: center;
            font-family: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .boot__logo {
            width: 72px;
            height: 72px;
        }

        .boot__title {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.45;
            color: #18181b;
        }

        .boot__hint {
            margin: 0;
            font-size: 12.5px;
            line-height: 1.45;
            color: #71717a;
        }

        .boot__bar {
            width: 132px;
            height: 2px;
            margin-top: 4px;
            border-radius: 10000px;
            background: #ececee;
            overflow: hidden;
        }

        .boot__bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: #a1a1aa;
            animation: boot-slide 1100ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
        }

        @keyframes boot-slide {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(250%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot__bar::after {
                animation: none;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="boot" class="boot" role="status" aria-live="polite">
        <svg class="boot__logo" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
            <!-- Версия для светлого фона: без плашки, контур вместо неё.
                   Углы треугольника скруглены, контур мягкий. -->
              <defs>
                <linearGradient id="boot-ray" gradientUnits="userSpaceOnUse" x1="0" y1="392" x2="0" y2="200">
                  <stop offset="0" stop-color="#e02f1d"/>
                  <stop offset="1" stop-color="#ff7a45"/>
                </linearGradient>

                <!-- лучи из центра основания -->
                <mask id="boot-rays" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
                  <circle cx="256" cy="392" r="210" fill="none" stroke="#fff" stroke-width="420"
                          pathLength="360" stroke-dasharray="9 9" transform="rotate(13.5 256 392)"/>
                </mask>

                <clipPath id="boot-triangle">
                  <path d="M239.49 205.72 Q256 176 272.51 205.72 L359.49 362.28 Q376 392 342 392 L170 392 Q136 392 152.51 362.28 Z"/>
                </clipPath>
              </defs>

              <!-- лучи внутри треугольника -->
              <rect x="100" y="150" width="312" height="260" fill="url(#boot-ray)" mask="url(#boot-rays)" clip-path="url(#boot-triangle)"/>

              <!-- контур треугольника поверх лучей -->
              <path d="M239.49 205.72 Q256 176 272.51 205.72 L359.49 362.28 Q376 392 342 392 L170 392 Q136 392 152.51 362.28 Z"
                    fill="none" stroke="#18181b" stroke-width="12" stroke-linejoin="round"/>

              <!-- основание -->
              <rect x="136" y="414" width="240" height="11" rx="5.5" fill="#18181b"/>

              <!-- академическая шапочка -->
              <g stroke-linejoin="round">
                <!-- кисточка -->
                <path d="M392 150 V236" stroke="#ff5a00" stroke-width="8" stroke-linecap="round"/>
                <rect x="380" y="230" width="24" height="42" rx="10" fill="#ff5a00"/>
                <!-- тулья -->
                <path d="M178 168 L256 204 L334 168 V240 Q256 290 178 240 Z" fill="#e4e4e7"/>
                <!-- квадратная плоскость -->
                <polygon points="256,84 414,150 256,216 98,150" fill="#fff" stroke="#18181b" stroke-width="12"/>
                <!-- пуговица -->
                <circle cx="256" cy="150" r="9" fill="#ff5a00"/>
              </g>
        </svg>
        <p class="boot__title">SuperBRS</p>
        <p class="boot__hint">Загружаем данные…</p>
        <span class="boot__bar" aria-hidden="true"></span>
    </div>
    <div id="app" class="app-shell"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
