<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Полнофункциональный клиент Сервиса БРС SFEDU">
    <meta name="theme-color" content="#f4f4f5">
    <meta name="color-scheme" content="light">
    <title>SFEDU БРС</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="SuperBRS">
    <link rel="preload" href="/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* Critical: painted before any bundle arrives, so the first frame is branded. */
        :root { color-scheme: light; }

        html,
        body {
            margin: 0;
            background: #f4f4f5;
        }

        .boot {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px;
            background: #f4f4f5;
            text-align: center;
            font-family: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        .boot__logo {
            width: 56px;
            height: 49px;
            opacity: 0.85;
        }

        .boot__title {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.45;
            color: #18181b;
        }

        .boot__hint {
            margin: 0;
            font-size: 12.5px;
            line-height: 1.45;
            color: #71717a;
        }

        .boot__bar {
            width: 132px;
            height: 2px;
            margin-top: 4px;
            border-radius: 10000px;
            background: #ececee;
            overflow: hidden;
        }

        .boot__bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: inherit;
            background: #a1a1aa;
            animation: boot-slide 1100ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
        }

        @keyframes boot-slide {
            from { transform: translateX(-100%); }
            to { transform: translateX(250%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .boot__bar::after { animation: none; width: 100%; }
        }
    </style>
</head>

<body>
    <div id="boot" class="boot" role="status" aria-live="polite">

            <defs>

            </defs>
